name: Minecraft 26.2 Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    name: Run Mineflayer 26.2
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Install Mineflayer 26.2
        run: |
          npm install --no-audit --no-fund \
            "https://github.com/Complexity-ML/mineflayer-26.2/releases/download/complexity-26.2.3/mineflayer-complexity-26.2.3.tgz"

      - name: Verify installation
        run: |
          node --version
          npm --version
          npm list mineflayer

      - name: Start bot
        env:
          MC_HOST: ${{ secrets.MC_HOST }}
          MC_PORT: ${{ secrets.MC_PORT }}
          MC_USERNAME: ${{ secrets.MC_USERNAME }}
          MC_AUTH: ${{ secrets.MC_AUTH }}
        run: |
          node index.js
